version: '3.9'

services:
  devmarket:
    image: node:22-alpine
    container_name: devmarket-app

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"