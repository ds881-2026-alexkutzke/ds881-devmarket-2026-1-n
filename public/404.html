<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>devmarket</title>
    <!--
      Single Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages
      Converte a rota recebida em uma querystring e redireciona para o index.html,
      que reconstrói a URL original. pathSegmentsToKeep = 1 mantém o nome do repo
      (/ds881-devmarket-2026-1-n/) no caminho ao publicar em subdiretório.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
